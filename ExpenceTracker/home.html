<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walcom Premium Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>


</head>

<body>
    <div class="container">
        <button onclick="logoutUser()" style="background: #dc3545;">Logout</button>

        <div id="membershipDiv">
            <button onclick="paymentPage()">Upgrade to Premium</button>
        </div>

        <div id="welcomeDiv" style="display: none;">
            <h2>Welcome to Walcom Premium Membership!</h2>
            <p>Enjoy unlimited expense tracking, detailed analytics, and priority support.</p>
            <button onclick="showLeaderBoad()">Show Leader Boad</button>
            <h3 id="LeaderBoad" style="display: none;">Leader Boad</h3>
            <ol id="LeaderBoadList"></ol>
        </div>

        <form id="myForm">
            <label for="description">Description:</label>
            <input type="text" id="description" placeholder="Enter expense description" required>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" placeholder="Enter amount" required>

            <label for="category">Category:</label>
            <select id="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">Add Expense</button>
        </form>

        <h3 id="totalAmountHeader">Total Amount: ₹0</h3>
        <h3>Expense History</h3>
        <ul id="detailsList"></ul>
    </div>
    <script src="home.js"></script>
</body>

</html>
