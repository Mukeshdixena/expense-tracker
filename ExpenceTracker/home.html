<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Edit & Delete</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        h2,
        h3 {
            color: #333;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }


        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        label {
            font-weight: bold;
            text-align: left;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #detailsList {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        #detailsList li {
            background: #f9f9f9;
            padding: 10px;
            border: 1px solid #ddd;
            margin-top: 5px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }

        #totalAmountHeader {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Expense Tracker</h2>
        <button onclick="paymentPage()">
            Buy Premium Membership
        </button>
        <form id="myForm">
            <label for="description">Description:</label>
            <input type="text" id="description" placeholder="Enter your description" required>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" placeholder="Enter your amount" required>

            <!-- Category Dropdown -->
            <label for="category">Category:</label>
            <select id="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">Submit</button>
        </form>

        <h3 id="totalAmountHeader">Total Amount: ₹0</h3> <!-- Total amount header -->

        <h3>Submitted Details</h3>
        <ul id="detailsList"></ul>
    </div>
    <script src="home.js"></script>
</body>

</html>
