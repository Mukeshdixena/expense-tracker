<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Edit & Delete</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
    <div class="container">
        <h2>Expense Tracker</h2>
        <form id="myForm">
            <label for="description">Description:</label>
            <input type="text" id="description" placeholder="Enter your description" required>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" placeholder="Enter your amount" required>

            <!-- Category Dropdown -->
            <label for="category">Category:</label>
            <select id="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">Submit</button>
        </form>

        <h3 id="totalAmountHeader">Total Amount: ₹0</h3> <!-- Total amount header -->

        <h3>Submitted Details</h3>
        <ul id="detailsList"></ul>
    </div>
    <script src="script/home.js"></script>
</body>

</html>
