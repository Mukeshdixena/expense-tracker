<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Edit & Delete</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
    <div class="container">
        <h2>Expense Tracker</h2>
        <form id="myForm">
            <label for="description">Description :</label>
            <input type="text" id="description" placeholder="Enter your description" required>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" placeholder="Enter your amount" required>

            <button type="submit">Submit</button>
        </form>

        <h3 id="totalAmountHeader">Total Amount: ₹0</h3> <!-- Added total amount header -->

        <h3>Submitted Details</h3>
        <ul id="detailsList"></ul>
    </div>
    <script src="script.js"></script>
</body>

</html>
